name: Main source guard

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

jobs:
  source-branch:
    name: source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as the source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$SOURCE_BRANCH" != "develop" ] || [ "$SOURCE_REPO" != "$BASE_REPO" ]; then
            echo "::error::Only pull requests from this repository's develop branch may target main."
            exit 1
          fi

